name: CI

# Bám theo Gitflow: dev (development) -> staging (QA/demo) -> prod (production).
# CI chạy trên mọi PR hướng vào 3 nhánh chính và khi push trực tiếp vào chúng.
on:
  pull_request:
    branches: [dev, staging, prod]
  push:
    branches: [dev, staging, prod]

# Hủy các lần chạy cũ trên cùng một nhánh/PR khi có commit mới.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bỏ qua các bước Node nếu repo chưa có package.json (giai đoạn khởi tạo).
      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có package.json — bỏ qua các bước Node. CI sẽ tự chạy đầy đủ khi có code."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has_pkg == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.has_pkg == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Các bước dưới dùng --if-present nên sẽ không fail khi script chưa được khai báo.
      - name: Lint
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm run lint --if-present

      - name: Type check
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm run typecheck --if-present

      - name: Test
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm run build --if-present
